    <p style="margin: 0 0 18px; font-size: 16px; line-height: 2.1; color: hsl(30 6% 12%)">雨夜的港口亮着灯。雨声敲打船舷,远处的汽笛裹在雾里,一声比一声低。后来雨停了。堤岸上只剩下水洼,映着断续的灯。</p>
