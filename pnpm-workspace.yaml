packages:
  - packages/*

onlyBuiltDependencies:
  - esbuild

overrides:
  tar: ^7.5.4
  esbuild: ^0.25.0
  tmp@<=0.2.3: '>=0.2.4'
  # One copy of prosemirror-model for Tiptap and the Yjs binding. Keep it at
  # 1.25.11 or later: prosemirror-view 1.42 parses clipboard HTML inside a
  # <body>, and an older model reads the line breaks Chromium on Windows puts
  # around the copied fragment as content (two hard breaks above and below
  # every paste of text copied in the app).
  prosemirror-model: 1.25.13
  # Security patch floors for transitive XML/YAML parsers.
  '@xmldom/xmldom@<0.8.15': 0.8.15
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'brace-expansion@<1.1.20': 1.1.20
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  # React's optional menu peers must match the selected Tiptap patch line.
  '@tiptap/extension-bubble-menu': 3.30.5
  '@tiptap/extension-floating-menu': 3.30.5

patchedDependencies:
  '@tiptap/y-tiptap@3.0.8': patches/@tiptap__y-tiptap@3.0.8.patch
  prosemirror-view@1.42.4: patches/prosemirror-view@1.42.4.patch

auditConfig:
  ignoreGhsas:
    # picomatch ReDoS through single-branch repeated extglobs. Accepted by the
    # author on 2026-11-18: no fixed release exists (4.0.7 is the latest and
    # still affected); it is reached only through build and lint tooling
    # (vite, typescript-eslint's tinyglobby) matching patterns written in this
    # repository, never input from a user or a book, and nothing of it ships
    # in the app. Drop this line once a fixed picomatch is published and the
    # lockfile takes it.
    - GHSA-fc5q-39xc-vjpf
