packages:
  - packages/*

onlyBuiltDependencies:
  - esbuild

overrides:
  tar: ^7.5.4
  esbuild: ^0.25.0
  tmp@<=0.2.3: '>=0.2.4'
  prosemirror-model: 1.25.7
  # Security patch floors for transitive XML/YAML parsers.
  '@xmldom/xmldom@<0.8.15': 0.8.15
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'brace-expansion@<1.1.20': 1.1.20
  'brace-expansion@>=5.0.0 <5.0.11': 5.0.11
  # React's optional menu peers must match the selected Tiptap patch line.
  '@tiptap/extension-bubble-menu': 3.30.5
  '@tiptap/extension-floating-menu': 3.30.5

patchedDependencies:
  '@tiptap/y-tiptap@3.0.8': patches/@tiptap__y-tiptap@3.0.8.patch
  prosemirror-view@1.42.4: patches/prosemirror-view@1.42.4.patch
