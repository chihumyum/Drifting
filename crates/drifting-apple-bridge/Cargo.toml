[package]
name = "drifting-apple-bridge"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
drifting-core = { path = "../drifting-core" }
drifting-document = { path = "../drifting-document" }
drifting-prose = { path = "../drifting-prose" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.14.0"
