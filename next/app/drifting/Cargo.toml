[package]
name = "drifting"
version = "0.2.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# F8's debug bridge (`cargo xtask dev --debug-bridge`): a local socket that
# lets an Agent session or a script drive this window, with in-app
# screenshots. Development builds only; `cargo xtask check` (gate
# `debug-bridge`) keeps it out of the default features and the release
# scripts, `cargo xtask check-binary` out of a built binary.
debug-bridge = ["dep:dr-debug-bridge", "dr-debug-bridge/screenshot"]
# GPUI's hot reload (`cargo xtask dev --hot`): run under `dx serve
# --hot-patch`, a view's render function and the code it calls are patched
# into the running app when they change. GPUI turns it on in debug builds
# only; `cargo xtask check` (gate `hot-reload`) keeps it out of the default
# features and the release scripts, `cargo xtask check-binary` out of a
# built binary.
hot-reload = ["gpui/hot-reload"]

[dependencies]
anyhow.workspace = true
dr-debug-bridge = { workspace = true, optional = true }
dr-platform.workspace = true
dr-shell.workspace = true
# F2's device identity for the library (writing days, epochs).
dr-store.workspace = true
dr-ui.workspace = true
dr-view-agent.workspace = true
dr-view-elements.workspace = true
dr-view-ideas.workspace = true
dr-view-feedback.workspace = true
dr-view-home.workspace = true
dr-view-import.workspace = true
dr-view-material.workspace = true
dr-view-transfer.workspace = true
# M42: automatic updates.
dr-view-update.workspace = true
dr-view-page.workspace = true
dr-view-plot.workspace = true
dr-view-sea.workspace = true
dr-view-shelf.workspace = true
dr-view-timeline.workspace = true
dr-workspace.workspace = true
# M41's restore waits on the shell's library swap.
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
log.workspace = true
# DRIFTING_CHECK (development builds): F3's queries the self-check reads.
serde_json.workspace = true

[dev-dependencies]
dr-agent.workspace = true
dr-agent-providers.workspace = true
dr-model.workspace = true
dr-testkit.workspace = true
tempfile.workspace = true

[[example]]
name = "agent-acceptance"
required-features = ["debug-bridge"]
