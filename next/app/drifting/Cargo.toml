[package]
name = "drifting"
version = "0.2.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["runtime-shaders"]
# GPUI compiles its Metal shaders when the first window opens instead of at
# build time, so a build needs no Metal Toolchain (a separate Xcode
# download). Every development build and CI keep it; the release build
# (`script/bundle-mac --precompiled-shaders`, the release workflow) builds
# with `--no-default-features` and precompiles them, which `cargo xtask
# check-binary --precompiled-shaders` checks. Only macOS has a difference.
runtime-shaders = ["gpui_platform/runtime_shaders"]
# The release client's identity (dr-platform's `RELEASE`: Drifting,
# cc.drifting.client, `drifting:`, the 0.1 client's keychain service and
# data folder). Off in every build but the release workflow's
# (`script/bundle-mac --release-identity`, `bundle-windows.ps1
# -ReleaseIdentity`); `cargo xtask check` (gate `release-identity`) keeps it
# out of the default features, and a build with it refuses to compile with
# the debug bridge or hot reload.
release-identity = ["dr-platform/release-identity"]
# F8's debug bridge (`cargo xtask dev --debug-bridge`): a local socket that
# lets an Agent session or a script drive this window, with in-app
# screenshots. Development builds only; `cargo xtask check` (gate
# `debug-bridge`) keeps it out of the default features and the release
# scripts, `cargo xtask check-binary` out of a built binary.
debug-bridge = ["dep:dr-debug-bridge", "dr-debug-bridge/screenshot"]
# GPUI's hot reload (`cargo xtask dev --hot`): run under `dx serve
# --hot-patch`, a view's render function and the code it calls are patched
# into the running app when they change. GPUI turns it on in debug builds
# only; `cargo xtask check` (gate `hot-reload`) keeps it out of the default
# features and the release scripts, `cargo xtask check-binary` out of a
# built binary.
hot-reload = ["gpui/hot-reload"]

[dependencies]
anyhow.workspace = true
dr-account.workspace = true
dr-debug-bridge = { workspace = true, optional = true }
dr-mcp.workspace = true
dr-platform.workspace = true
dr-shell.workspace = true
# F2's device identity for the library (writing days, epochs).
dr-store.workspace = true
dr-sync.workspace = true
dr-ui.workspace = true
dr-view-account.workspace = true
dr-view-agent.workspace = true
dr-view-element-overview.workspace = true
dr-view-elements.workspace = true
dr-view-feedback.workspace = true
dr-view-home.workspace = true
dr-view-import.workspace = true
dr-view-material.workspace = true
dr-view-transfer.workspace = true
# M42: automatic updates.
dr-view-update.workspace = true
dr-view-page.workspace = true
dr-view-plot.workspace = true
dr-view-relations.workspace = true
dr-view-sea.workspace = true
dr-view-shelf.workspace = true
dr-view-timeline.workspace = true
dr-view-templates.workspace = true
dr-workspace.workspace = true
# M41's restore waits on the shell's library swap.
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
log.workspace = true
# DRIFTING_CHECK (development builds): F3's queries the self-check reads.
serde_json.workspace = true

[dev-dependencies]
dr-agent.workspace = true
dr-agent-providers.workspace = true
dr-editor.workspace = true
# The release identity's folders on a synthetic 0.1 data folder
# (`data_folder_tests`, with dr-import-v1's test library).
dr-import-v1.workspace = true
dr-model.workspace = true
dr-testkit.workspace = true
dr-view-search.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui-prose.workspace = true
gpui_platform = { workspace = true, features = ["runtime_shaders", "test-support"] }
rusqlite.workspace = true
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc.workspace = true

[[example]]
name = "v3-heavy-bench"

[[example]]
name = "agent-acceptance"
required-features = ["debug-bridge"]

[[example]]
name = "mcp-acceptance"
required-features = ["debug-bridge"]

[[example]]
name = "home-cards-acceptance"
required-features = ["debug-bridge"]
