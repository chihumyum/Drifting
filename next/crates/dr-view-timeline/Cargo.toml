[package]
name = "dr-view-timeline"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Drifting's bottom timeline (M14): storyline lanes in reading or narrative order, chapters dragged between them"

[features]
# Offscreen screenshots of the timeline (`examples/timeline-capture.rs`),
# through GPUI's headless test platform.
capture = ["dep:gpui_platform", "gpui_platform/test-support", "dep:color_quant", "dep:png"]

[dependencies]
color_quant = { workspace = true, optional = true }
dr-i18n.workspace = true
dr-shell.workspace = true
dr-ui.workspace = true
dr-workspace.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, optional = true }
log.workspace = true
png = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
anyhow.workspace = true
dr-store.workspace = true
dr-testkit.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
tempfile.workspace = true

[[example]]
name = "timeline-capture"
required-features = ["capture"]
