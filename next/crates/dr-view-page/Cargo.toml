[package]
name = "dr-view-page"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The chapter page around its text (M03): the folio line, the title and synopsis fields, an act's title page, ⁂ and its menu, the empty-page hint, drawn through dr-editor's PageChrome"

[features]
# Offscreen screenshots of the page in the shell (`examples/page-capture`).
capture = ["gpui_platform/test-support"]

[dependencies]
dr-editor.workspace = true
dr-i18n.workspace = true
dr-model.workspace = true
dr-shell.workspace = true
dr-ui.workspace = true
dr-workspace.workspace = true
gpui.workspace = true
log.workspace = true

[dev-dependencies]
anyhow.workspace = true
dr-store.workspace = true
dr-testkit.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[example]]
name = "page-capture"
required-features = ["capture"]
