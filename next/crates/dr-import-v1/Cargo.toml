[package]
name = "dr-import-v1"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Drifting 0.2: import a 0.1.x library (SQLite + contentJson caches, no Yjs) into the Loro book and prose documents of dr-doc, stored by dr-store (module M10)"

[dependencies]
dr-doc.workspace = true
# Search, outlines and word counts built right after the import.
dr-index.workspace = true
dr-model.workspace = true
dr-store.workspace = true
log.workspace = true
loro.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

# The m10-import tool's peak-memory reading.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Measured evidence in the one format (`examples/m10-measure.rs`).
dr-testkit.workspace = true
tempfile.workspace = true

[build-dependencies]
serde_json.workspace = true
