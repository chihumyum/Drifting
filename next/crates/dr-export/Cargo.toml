[package]
name = "dr-export"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Export (M41): the finished manuscript as EPUB, Word or PDF, Markdown share and book covers, read from Loro through F3"

[dependencies]
base64.workspace = true
dr-doc.workspace = true
dr-model.workspace = true
# `.driftingbook`: documents and asset files are read and written below F3.
dr-store.workspace = true
dr-workspace.workspace = true
fontdb.workspace = true
# The cover picker reads what the 0.1 picker offered: PNG, JPEG, GIF, WebP,
# BMP and TIFF (GPUI's image stack already builds their decoders).
image = { workspace = true, features = ["bmp", "gif", "jpeg", "tiff", "webp"] }
krilla.workspace = true
loro.workspace = true
loro-common.workspace = true
# The editor's line-breaking rules (UAX #14 from ICU4X with the Chinese
# tailoring), shared with the PDF: simplifications.md row 19.
prose-linebreak = { workspace = true, features = ["icu"] }
# Reads Word documents for the import (M41).
roxmltree.workspace = true
rustybuzz.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zip.workspace = true

[dev-dependencies]
dr-testkit.workspace = true
tempfile.workspace = true
