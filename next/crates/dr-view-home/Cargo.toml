[package]
name = "dr-view-home"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Drifting's Project Home (M02): the book's name and progress, where to continue, its storylines and categories"

[features]
# Offscreen screenshots and timings of the bookshelf and Project Home
# (`examples/shelf-home-capture.rs`), through GPUI's headless test platform.
capture = ["dep:gpui_platform", "gpui_platform/test-support", "dep:color_quant", "dep:png"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
color_quant = { workspace = true, optional = true }
dr-doc.workspace = true
dr-i18n.workspace = true
dr-model.workspace = true
dr-shell.workspace = true
dr-store.workspace = true
dr-ui.workspace = true
dr-view-shelf.workspace = true
dr-view-stats.workspace = true
dr-workspace.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, optional = true }
log.workspace = true
png = { workspace = true, optional = true }
serde_json.workspace = true

[dev-dependencies]
dr-testkit.workspace = true
dr-view-sea.workspace = true
dr-view-shelf-art.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
tempfile.workspace = true
