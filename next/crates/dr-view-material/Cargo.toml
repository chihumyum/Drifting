[package]
name = "dr-view-material"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Materials (M19): the image and PDF viewer (zoom, pan, PDF pages rendered with hayro) and comments on regions of the picture"

[features]
# Offscreen screenshots of the page in the shell (`examples/m19-capture`).
capture = ["dep:gpui_platform", "gpui_platform/test-support", "dep:color_quant", "dep:png", "dep:anyhow", "dep:tempfile", "dep:dr-testkit"]

[dependencies]
dr-doc.workspace = true
dr-i18n.workspace = true
dr-model.workspace = true
dr-shell.workspace = true
dr-store.workspace = true
dr-ui.workspace = true
dr-view-review.workspace = true
dr-workspace.workspace = true
futures.workspace = true
gpui.workspace = true
hayro.workspace = true
image = { workspace = true, features = ["bmp", "gif", "jpeg", "tiff", "webp"] }
log.workspace = true
serde_json.workspace = true
smallvec.workspace = true
# capture
anyhow = { workspace = true, optional = true }
color_quant = { workspace = true, optional = true }
dr-testkit = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
png = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
dr-testkit.workspace = true
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[[example]]
name = "m19-capture"
required-features = ["capture"]
