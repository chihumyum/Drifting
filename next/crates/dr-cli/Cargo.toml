[package]
name = "dr-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Drifting's development command line (`cargo drifting workspace describe | call | inspect | scenario`, `cargo drifting app …`), with the offline-write safety rules"

[[bin]]
name = "dr-cli"
path = "src/main.rs"

[dependencies]
base64.workspace = true
dr-debug-protocol.workspace = true
dr-doc.workspace = true
# M10's synthetic 0.1 library for import scenarios (its schema and handoff
# hash; the fixture itself is dr-import-v1's tests/common).
dr-import-v1.workspace = true
dr-model.workspace = true
dr-platform.workspace = true
dr-store.workspace = true
dr-testkit.workspace = true
dr-workspace.workspace = true
loro.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
