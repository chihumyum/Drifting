[package]
name = "dr-account"
version = "0.2.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "M35 Hosted account, session, PKCE OAuth and account-isolated library registry"

[features]
default = ["network"]
network = ["dep:reqwest", "dep:rustls", "dr-platform/network"]
test-support = []

[dependencies]
base64.workspace = true
chrono.workspace = true
dr-platform.workspace = true
getrandom.workspace = true
image.workspace = true
log.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
# `proxy::fake`: a fake proxy as the system's, for `tests/system_proxy.rs`.
dr-platform = { workspace = true, features = ["test-support"] }
dr-store.workspace = true
tempfile.workspace = true
