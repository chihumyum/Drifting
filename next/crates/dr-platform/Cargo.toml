[package]
name = "dr-platform"
version = "0.2.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Drifting's platform services: logs, crash reports, keychain, deep links and single instance, updates, feedback"

[features]
default = ["network"]
# Sentry's transport and the updater's HTTP client. Off, everything else still
# builds, which lets `cargo check --target x86_64-pc-windows-msvc` run on a Mac
# without a Windows C toolchain for the TLS stack.
network = ["dep:reqwest", "dep:rustls", "sentry/reqwest", "sentry/rustls-no-provider"]
# For other crates' tests: `feedback::fake_service`, a stand-in for the
# Hosted service on 127.0.0.1; `update::fetch::fake_server`, one for GitHub
# Releases; throwaway updater keys and synthetic bundles.
test-support = ["dep:minisign"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
flate2.workspace = true
log.workspace = true
minisign = { workspace = true, optional = true }
minisign-verify.workspace = true
regex.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
semver.workspace = true
sentry.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-security.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
keyring.workspace = true
minisign.workspace = true
tempfile.workspace = true

# Crash reports end to end against a stand-in for Sentry on 127.0.0.1. Its
# own harness: the crash reporter re-runs the test executable.
[[test]]
name = "crash_report"
harness = false
