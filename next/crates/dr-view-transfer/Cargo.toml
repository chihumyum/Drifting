[package]
name = "dr-view-transfer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Moving books in and out (M41): .driftingbook export and import from the bookshelf, importing Markdown, text and Word files into a book, whole-library backup and restore"

[features]
# Offscreen screenshots of the dialogs (`examples/transfer-capture.rs`),
# through GPUI's headless test platform.
capture = ["dep:anyhow", "dep:gpui_platform", "gpui_platform/test-support", "dep:color_quant", "dep:png"]

[dependencies]
anyhow = { workspace = true, optional = true }
color_quant = { workspace = true, optional = true }
chrono.workspace = true
dr-export.workspace = true
dr-i18n.workspace = true
dr-shell.workspace = true
dr-store.workspace = true
dr-ui.workspace = true
dr-view-shelf.workspace = true
dr-workspace.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, optional = true }
log.workspace = true
png = { workspace = true, optional = true }

[dev-dependencies]
# 《慢钟》 behind the pictures.
dr-testkit.workspace = true
gpui = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true

[[example]]
name = "transfer-capture"
required-features = ["capture"]
