[package]
name = "dr-store"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Drifting 0.2 storage: SQLite library database, Loro update log and snapshots, document holders, derived indexes, assets, migrations"

[dependencies]
flate2.workspace = true
getrandom.workspace = true
log.workspace = true
loro.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zip.workspace = true

[dev-dependencies]
# Only to check that both Origin types spell every origin the same way.
dr-model.workspace = true
# The shared random streams and corpus (dr-corpus, no store). Not
# dr-testkit, dr-samples or dr-index: they depend on dr-store, and that
# cycle stops dx's hot patching (`cargo xtask dev --hot`). The tests that
# need the seeds, the crash harness or the real deriver are in dr-testkit's
# tests (crash_migrate, store_rebuild).
dr-corpus.workspace = true
# Only to check that the outline trims exactly what dr-text trims.
prose-metrics.workspace = true
tempfile.workspace = true
