[package]
name = "dr-store"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Drifting 0.2 storage: SQLite library database, Loro update log and snapshots, document holders, derived indexes, assets, migrations"

[dependencies]
flate2.workspace = true
getrandom.workspace = true
log.workspace = true
loro.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zip.workspace = true

[dev-dependencies]
# The real deriver, to measure typing while stale indexes are rebuilt
# (integration tests only, like dr-testkit).
dr-index.workspace = true
# Only to check that both Origin types spell every origin the same way.
dr-model.workspace = true
# The shared seeds, random streams and crash harness; integration tests only
# (dr-testkit depends on dr-store, so a unit test would see two dr-stores).
dr-testkit.workspace = true
# Only to check that the outline trims exactly what dr-text trims.
prose-metrics.workspace = true
tempfile.workspace = true
