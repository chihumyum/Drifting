[package]
name = "dr-agent-providers"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "M28 model protocols, shared streaming HTTP, catalogs and subscription login"

[features]
# For tests: `HttpClient::with_stand_in`, which sends what is meant for a
# service on the internet (`https://api.example.com`) to a loopback fake.
test-support = []

[dependencies]
base64.workspace = true
dr-agent.workspace = true
dr-model.workspace = true
dr-platform.workspace = true
futures.workspace = true
httpdate.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
# This crate's own tests reach a stand-in for a service on the internet.
dr-agent-providers = { workspace = true, features = ["test-support"] }
# `proxy::fake`: a fake proxy as the system's, for `tests/system_proxy.rs`.
dr-platform = { workspace = true, features = ["test-support"] }
dr-store.workspace = true
dr-testkit.workspace = true
dr-workspace.workspace = true
keyring.workspace = true
tempfile.workspace = true
