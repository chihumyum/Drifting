<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Drifting</title>
    <!-- This placeholder has no dependency on renderer modules or native IPC. -->
    <style>
      #app-startup-loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: hsl(30 8% 96.5%);
        color: hsl(218 22% 52%);
      }
      #app-startup-loading > span {
        box-sizing: border-box;
        width: 24px;
        height: 24px;
        border: 2px solid hsl(30 5% 89%);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: app-startup-spin 0.8s linear infinite;
      }
      .dark #app-startup-loading {
        background: hsl(220 6% 11%);
        color: hsl(218 35% 65%);
      }
      .dark #app-startup-loading > span {
        border-color: hsl(220 5% 22%);
        border-top-color: currentColor;
      }
      @keyframes app-startup-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-startup-loading > span { animation: none; }
      }
    </style>

    <!-- Drifting design-system fonts are bundled locally via
         @fontsource-variable and imported in src/renderer/main.tsx (Inter Tight
         for UI; Newsreader and Noto Serif SC for optional prose). This replaces the former
         Google Fonts CDN <link>; packaged native builds now match dev and
         work offline. -->
  </head>
  <body>
    <div id="root">
      <!-- React replaces this node on its first commit; no timer or overlay teardown. -->
      <div id="app-startup-loading" role="status" aria-label="正在启动 Drifting" data-tauri-drag-region>
        <span aria-hidden="true"></span>
      </div>
    </div>
    <script src="/startup.js"></script>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
