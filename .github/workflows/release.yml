name: Release

# Pushing tag v<version> builds a signed, notarized macOS release as a draft.
# Publishing the draft makes it the latest release, which is what the app's
# updater offers (docs/releasing.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      VITE_LOCAL_ONLY_MODE: 'true'
      VITE_REQUIRE_AUTH: 'false'
      VITE_AI_TRANSPORT: direct
      VITE_API_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, toolchain input
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-release.mjs "${GITHUB_REF_NAME}"
      - run: pnpm ci:contract:check
      - run: pnpm public:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm agent:capabilities:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

  build:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    env:
      # The official build signs in to Hosted and allows sign-up.
      DRIFTING_HOSTED_ORIGIN: ${{ vars.DRIFTING_HOSTED_ORIGIN }}
      VITE_TERMS_URL: https://drifting.cc/terms
      VITE_PRIVACY_URL: https://drifting.cc/privacy
      DRIFTING_UPDATER_PUBLIC_KEY: ${{ vars.DRIFTING_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, toolchain input
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Require release inputs
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for name in DRIFTING_HOSTED_ORIGIN DRIFTING_UPDATER_PUBLIC_KEY TAURI_SIGNING_PRIVATE_KEY \
            APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "::error::$name is not configured"; missing=1; fi
          done
          exit "$missing"
      - name: Import Developer ID Application certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/drifting-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/drifting-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          APPLE_SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          test -n "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Install App Store Connect notarization key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and staple
        run: node scripts/run-desktop-tauri.mjs build --online --target aarch64-apple-darwin --bundles app,dmg
      - name: Verify signed artifacts
        run: |
          BUNDLE=src-tauri/target/aarch64-apple-darwin/release/bundle
          APP_PATH=$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' -print -quit)
          DMG_PATH=$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          UPDATE_PATH=$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)
          test -d "$APP_PATH" && test -f "$DMG_PATH" && test -f "$UPDATE_PATH" && test -f "$UPDATE_PATH.sig"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          mkdir -p "$RUNNER_TEMP/drifting-dmg"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/drifting-dmg"
          MOUNTED_APP=$(find "$RUNNER_TEMP/drifting-dmg" -maxdepth 1 -name '*.app' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$MOUNTED_APP"
          spctl --assess --type execute --verbose=2 "$MOUNTED_APP"
          hdiutil detach "$RUNNER_TEMP/drifting-dmg"
      - name: Assemble release files
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE=src-tauri/target/aarch64-apple-darwin/release/bundle
          RELEASE_DIR="$RUNNER_TEMP/drifting-release"
          mkdir -p "$RELEASE_DIR"
          cp "$BUNDLE"/dmg/*.dmg "$RELEASE_DIR/"
          cp "$BUNDLE"/macos/*.app.tar.gz "$BUNDLE"/macos/*.app.tar.gz.sig "$RELEASE_DIR/"
          UPDATE_NAME=$(basename "$(find "$RELEASE_DIR" -maxdepth 1 -name '*.app.tar.gz' -print -quit)")
          node scripts/create-update-manifest.mjs \
            --version "$VERSION" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${UPDATE_NAME}" \
            --signature-file "$RELEASE_DIR/$UPDATE_NAME.sig" \
            --notes-file "docs/releases/${VERSION}.md" \
            --output "$RELEASE_DIR/latest.json"
          node scripts/generate-release-sbom.mjs "$RELEASE_DIR/sbom.spdx.json"
          (cd "$RELEASE_DIR" && shasum -a 256 ./* > SHA256SUMS.txt)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
      - name: Create draft release
        run: |
          NOTES_FILE="docs/releases/${VERSION}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true"
            gh release upload "$GITHUB_REF_NAME" "$RELEASE_DIR"/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE" --title "Drifting ${VERSION}" --draft
          else
            gh release create "$GITHUB_REF_NAME" "$RELEASE_DIR"/* --verify-tag --draft --title "Drifting ${VERSION}" --notes-file "$NOTES_FILE"
          fi
