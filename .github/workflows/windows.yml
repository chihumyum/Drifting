name: Windows

# Windows preview builds (docs/windows.md). Runs the Rust library tests and the
# contributor's developer commands on Windows and builds unsigned NSIS
# installers for x64 and ARM64 that sign in to Hosted. Nothing is published:
# the installers are workflow artifacts for manual acceptance in a Windows
# machine or virtual machine.
on:
  push:
    branches: ['claude/windows-port', 'windows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-tests:
    name: windows / rust tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, toolchain input
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri
            crates/drifting-core
          key: tests
      # tauri::generate_context! needs the frontend folder to exist; the tests
      # do not load it.
      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
        shell: bash
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      # The database, migration safety snapshots, backups and the asset store
      # live in drifting-core; run its tests even when the app's tests fail.
      - if: ${{ !cancelled() }}
        run: cargo test --manifest-path crates/drifting-core/Cargo.toml --locked
      - if: ${{ !cancelled() }}
        run: cargo test --manifest-path crates/drifting-document/Cargo.toml --locked
      - if: ${{ !cancelled() }}
        run: cargo test --manifest-path crates/drifting-prose/Cargo.toml --locked

  # The commands a contributor runs on Windows (docs/windows.md, "Developing
  # on Windows"). Every check after install runs even when an earlier one fails.
  developer-commands:
    name: windows / developer commands
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - if: ${{ !cancelled() }}
        run: pnpm typecheck
      - if: ${{ !cancelled() }}
        run: pnpm lint
      - if: ${{ !cancelled() }}
        run: pnpm ci:contract:check
      - if: ${{ !cancelled() }}
        run: pnpm public:check
      - if: ${{ !cancelled() }}
        run: pnpm agent:capabilities:check
      # A branch push names the branch, not a v* tag; check against the version.
      - if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/check-release.mjs "v$(node -p 'require("./package.json").version')"
      - if: ${{ !cancelled() }}
        run: pnpm dev:check
      - if: ${{ !cancelled() }}
        run: node scripts/run-worktree-dev.mjs --print-config
      - if: ${{ !cancelled() }}
        run: pnpm dev:seed:lite --print-config
      - if: ${{ !cancelled() }}
        run: pnpm drifting --help
      - if: ${{ !cancelled() }}
        run: pnpm dev:commands:check
      - if: ${{ !cancelled() }}
        run: pnpm frontend:debug:check
      - if: ${{ !cancelled() }}
        run: pnpm test

  installer:
    name: windows / installer (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DRIFTING_HOSTED_ORIGIN: ${{ vars.DRIFTING_HOSTED_ORIGIN }}
      VITE_TERMS_URL: https://drifting.cc/terms
      VITE_PRIVACY_URL: https://drifting.cc/privacy
      # The public key is compiled in, so a preview install updates to the next
      # published release that ships Windows; previews sign no updates of their own.
      DRIFTING_UPDATER_PUBLIC_KEY: ${{ vars.DRIFTING_UPDATER_PUBLIC_KEY }}
      DRIFTING_UPDATER_ARTIFACTS: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, toolchain input
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build the unsigned installer
        run: node scripts/run-desktop-tauri.mjs build --online --target ${{ matrix.target }} --bundles nsis
      - name: Name the installer by commit
        shell: bash
        run: |
          INSTALLER=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -maxdepth 1 -name '*.exe' -print -quit)
          test -f "$INSTALLER"
          mkdir -p out/windows
          cp "$INSTALLER" "out/windows/Drifting-preview-${GITHUB_SHA::8}-${{ matrix.arch }}-setup.exe"
          ls -l out/windows
      # An installer that builds can still hold an App that exits at start
      # (11-05: the updater plugin lacked its configuration). Install it for
      # this user, open Drifting and require it still running 20 seconds later.
      - name: Install and open the App
        shell: pwsh
        run: |
          $installer = Get-ChildItem out/windows/*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Drifting\drifting.exe'
          if (-not (Test-Path $app)) { throw "the installer did not install $app" }
          $stderr = Join-Path $env:RUNNER_TEMP 'drifting-stderr.txt'
          $process = Start-Process -FilePath $app -RedirectStandardError $stderr -PassThru
          Start-Sleep -Seconds 20
          $exited = $process.HasExited
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($exited) { throw "Drifting exited at start with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drifting-windows-${{ matrix.arch }}-${{ github.sha }}
          path: out/windows/*.exe
          if-no-files-found: error
          retention-days: 14
